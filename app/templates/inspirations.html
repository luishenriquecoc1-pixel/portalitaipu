{% extends "base.html" %}
{% block title %}Inspiracoes - Portal MKT{% endblock %}
{% block page_title %}Inspiracoes e Achados{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6 animate-fadeInUp stagger-1">
    <div class="flex items-center gap-3 flex-1 max-w-lg">
        <div class="relative flex-1">
            <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="insp-search" oninput="searchInspirations()" placeholder="Buscar inspiracoes..." class="w-full border border-surface-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent">
        </div>
        <select id="insp-tag-filter" onchange="filterByTag()" class="border border-surface-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
            <option value="">Todas as tags</option>
            <option value="referencia">Referencia</option>
            <option value="tendencia">Tendencia</option>
            <option value="concorrente">Concorrente</option>
            <option value="viral">Viral</option>
            <option value="design">Design</option>
            <option value="copy">Copy</option>
            <option value="video">Video</option>
            <option value="campanha">Campanha</option>
        </select>
    </div>
</div>

<!-- Quick Add -->
<div class="bg-gradient-to-r from-violet-50 to-indigo-50 border border-brand-200 rounded-2xl p-5 mb-6 animate-fadeInUp stagger-2">
    <h4 class="font-bold text-brand-800 mb-3 flex items-center gap-2"><i class="bi bi-lightning-charge-fill"></i> Adicionar Inspiracao</h4>
    <form onsubmit="quickAddInspiration(event)" class="flex flex-wrap gap-3">
        <input type="text" id="quick-insp-title" required placeholder="Titulo da inspiracao..." class="flex-1 min-w-[180px] border border-brand-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-400 bg-white">
        <input type="url" id="quick-insp-url" required placeholder="https://link-da-inspiracao.com" class="flex-1 min-w-[220px] border border-brand-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-400 bg-white">
        <input type="text" id="quick-insp-tags" placeholder="Tags (virgula)" class="w-48 border border-brand-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-400 bg-white">
        <button type="submit" class="bg-brand-500 hover:bg-brand-600 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition btn-ripple flex items-center gap-2">
            <i class="bi bi-plus-lg"></i> Salvar
        </button>
    </form>
</div>

<!-- Grid -->
<div id="insp-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 animate-fadeInUp stagger-3"></div>

<!-- Detail Modal -->
<div id="insp-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden py-10 px-4 overflow-y-auto flex flex-col items-center">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full">
        <div class="p-6 border-b border-surface-100 flex items-center justify-between">
            <h3 class="text-lg font-bold text-gray-800">Nova Inspiracao</h3>
            <button onclick="closeInspModal()" class="p-1 rounded-lg hover:bg-surface-100"><i class="bi bi-x-lg"></i></button>
        </div>
        <form id="insp-form" onsubmit="saveInspiration(event)" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Titulo</label>
                <input type="text" id="insp-title" required class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">URL</label>
                <input type="url" id="insp-url" required placeholder="https://" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Descricao</label>
                <textarea id="insp-description" rows="3" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500" placeholder="Por que isso e interessante?"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tags (separadas por virgula)</label>
                <input type="text" id="insp-tags" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500" placeholder="referencia, tendencia, viral">
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 bg-brand-500 hover:bg-brand-600 text-white py-2.5 rounded-xl text-sm font-medium transition btn-ripple">Salvar</button>
                <button type="button" onclick="closeInspModal()" class="px-6 py-2.5 border border-surface-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-surface-50">Cancelar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const tagColors = {
    referencia: 'bg-blue-100 text-blue-700',
    tendencia: 'bg-pink-100 text-pink-700',
    concorrente: 'bg-red-100 text-red-700',
    viral: 'bg-fuchsia-100 text-fuchsia-700',
    design: 'bg-emerald-100 text-emerald-700',
    copy: 'bg-amber-100 text-amber-700',
    video: 'bg-purple-100 text-purple-700',
    campanha: 'bg-cyan-100 text-cyan-700'
};

function isVideoUrl(url) {
    if (!url) return false;
    const lower = url.toLowerCase();
    return lower.includes('youtube.com') || lower.includes('youtu.be')
        || lower.includes('instagram.com') || lower.includes('tiktok.com')
        || lower.includes('vimeo.com');
}

function getUrlIcon(url) {
    if (!url) return 'bi-link-45deg';
    const lower = url.toLowerCase();
    if (lower.includes('youtube.com') || lower.includes('youtu.be')) return 'bi-youtube text-red-500';
    if (lower.includes('instagram.com')) return 'bi-instagram text-pink-500';
    if (lower.includes('tiktok.com')) return 'bi-tiktok text-gray-800';
    if (lower.includes('vimeo.com')) return 'bi-play-circle-fill text-blue-500';
    if (isVideoUrl(url)) return 'bi-camera-video-fill text-purple-500';
    return 'bi-link-45deg text-brand-500';
}

function inspCard(item, idx) {
    const tags = item.tags ? item.tags.split(',').map(t => t.trim()).filter(Boolean) : [];
    const stagger = (idx % 8) + 1;
    const icon = getUrlIcon(item.url);
    const isVideo = isVideoUrl(item.url);
    return `
    <div class="bg-white rounded-2xl border border-surface-200 shadow-sm card-hover transition-all p-5 animate-fadeInUp stagger-${stagger}">
        <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl ${isVideo ? 'bg-purple-50' : 'bg-brand-50'} flex items-center justify-center flex-shrink-0">
                    <i class="bi ${icon} text-lg"></i>
                </div>
                <div class="flex flex-wrap gap-1.5">
                    ${tags.map(t => `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full ${tagColors[t] || 'bg-gray-100 text-gray-600'}">${t}</span>`).join('')}
                </div>
            </div>
            <button onclick="deleteInspiration(${item.id})" class="p-1.5 rounded-lg hover:bg-red-50 flex-shrink-0" title="Excluir">
                <i class="bi bi-trash text-red-400 text-sm"></i>
            </button>
        </div>
        <h4 class="font-bold text-gray-800 mb-1.5 line-clamp-2">${item.title}</h4>
        ${item.description ? `<p class="text-sm text-gray-500 line-clamp-2 mb-2">${item.description}</p>` : ''}
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-sm text-brand-500 hover:text-brand-700 font-medium truncate max-w-full mb-3 transition-colors">
            <i class="bi bi-box-arrow-up-right text-xs"></i>
            <span class="truncate">${item.url}</span>
        </a>
        <div class="flex items-center justify-between pt-3 border-t border-surface-100">
            <span class="text-xs text-gray-400 flex items-center gap-1">
                <i class="bi bi-person"></i> ${item.creator_name || 'Anonimo'}
            </span>
            <span class="text-xs text-gray-400">${new Date(item.created_at).toLocaleDateString('pt-BR')}</span>
        </div>
    </div>`;
}

let allInspirations = [];

async function loadInspirations() {
    const search = document.getElementById('insp-search').value;
    const tag = document.getElementById('insp-tag-filter').value;
    let url = '/api/inspirations?';
    if (search) url += `search=${encodeURIComponent(search)}&`;
    if (tag) url += `tag=${encodeURIComponent(tag)}&`;
    try {
        const res = await fetch(url);
        allInspirations = await res.json();
    } catch(e) {
        allInspirations = [];
    }
    renderGrid();
}

function renderGrid() {
    const grid = document.getElementById('insp-grid');
    if (allInspirations.length === 0) {
        grid.innerHTML = `
        <div class="col-span-3 text-center py-16 text-gray-400">
            <div class="w-20 h-20 bg-brand-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="bi bi-lightbulb text-4xl text-brand-300"></i>
            </div>
            <p class="text-lg font-medium text-gray-500 mb-1">Nenhuma inspiracao adicionada ainda</p>
            <p class="text-sm">Compartilhe videos, posts e links que inspiram a equipe!</p>
        </div>`;
    } else {
        grid.innerHTML = allInspirations.map((item, idx) => inspCard(item, idx)).join('');
    }
}

function searchInspirations() {
    clearTimeout(window._inspSearchTimeout);
    window._inspSearchTimeout = setTimeout(loadInspirations, 300);
}

function filterByTag() { loadInspirations(); }

async function quickAddInspiration(e) {
    e.preventDefault();
    const title = document.getElementById('quick-insp-title').value;
    const url = document.getElementById('quick-insp-url').value;
    const tags = document.getElementById('quick-insp-tags').value;
    try {
        await fetch('/api/inspirations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, url, tags })
        });
        document.getElementById('quick-insp-title').value = '';
        document.getElementById('quick-insp-url').value = '';
        document.getElementById('quick-insp-tags').value = '';
        loadInspirations();
    } catch(e) {
        alert('Erro ao salvar inspiracao');
    }
}

function openInspModal() {
    document.getElementById('insp-form').reset();
    document.getElementById('insp-modal').classList.remove('hidden');
}
function closeInspModal() {
    document.getElementById('insp-modal').classList.add('hidden');
}

async function saveInspiration(e) {
    e.preventDefault();
    const data = {
        title: document.getElementById('insp-title').value,
        url: document.getElementById('insp-url').value,
        description: document.getElementById('insp-description').value,
        tags: document.getElementById('insp-tags').value
    };
    try {
        await fetch('/api/inspirations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        closeInspModal();
        loadInspirations();
    } catch(e) {
        alert('Erro ao salvar inspiracao');
    }
}

async function deleteInspiration(id) {
    if (!confirm('Excluir esta inspiracao?')) return;
    try {
        await fetch(`/api/inspirations/${id}`, { method: 'DELETE' });
        loadInspirations();
    } catch(e) {
        alert('Erro ao excluir');
    }
}

loadInspirations();
</script>
{% endblock %}
