{% extends "base.html" %}
{% block title %}Campanhas - Portal MKT{% endblock %}
{% block page_title %}Campanhas{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div class="flex gap-2">
        <button onclick="filterCampaigns('')" class="camp-filter px-4 py-2 rounded-xl text-sm font-medium bg-brand-500 text-white" data-f="">Todas</button>
        {% for s in statuses %}
        <button onclick="filterCampaigns('{{ s }}')" class="camp-filter px-4 py-2 rounded-xl text-sm font-medium bg-white border border-surface-200 text-gray-600 hover:bg-surface-50" data-f="{{ s }}">{{ s|title }}</button>
        {% endfor %}
    </div>
    <button onclick="openCampModal()" class="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 transition shadow-sm">
        <i class="bi bi-plus-lg"></i> Nova Campanha
    </button>
</div>

<!-- Stats -->
<div class="grid grid-cols-4 gap-4 mb-6" id="camp-stats"></div>

<!-- Cards Grid -->
<div id="campaigns-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

<!-- Modal -->
<div id="camp-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-start justify-center p-4 pt-10 overflow-y-auto">
    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border dark:border-gray-700">
        <div class="p-6 border-b border-surface-100 flex items-center justify-between">
            <h3 id="camp-modal-title" class="text-lg font-bold text-gray-800">Nova Campanha</h3>
            <button onclick="closeCampModal()" class="p-1 rounded-lg hover:bg-surface-100"><i class="bi bi-x-lg"></i></button>
        </div>
        <form id="camp-form" onsubmit="saveCampaign(event)" class="p-6 space-y-4">
            <input type="hidden" id="camp-id" value="">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                <input type="text" id="camp-name" required class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Descricao</label>
                <textarea id="camp-description" rows="3" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data inicio</label>
                    <input type="date" id="camp-start" required class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data fim</label>
                    <input type="date" id="camp-end" required class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Orcamento (R$)</label>
                    <input type="number" id="camp-budget" step="0.01" value="0" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select id="camp-status" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                        {% for s in statuses %}<option value="{{ s }}">{{ s|title }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cor</label>
                    <select id="camp-color" class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                        <option value="#3b82f6">&#9632; Azul</option>
                        <option value="#8b5cf6">&#9632; Roxo</option>
                        <option value="#ec4899">&#9632; Rosa</option>
                        <option value="#f59e0b" selected>&#9632; Laranja</option>
                        <option value="#ef4444">&#9632; Vermelho</option>
                        <option value="#22c55e">&#9632; Verde</option>
                        <option value="#6366f1">&#9632; Indigo</option>
                        <option value="#06b6d4">&#9632; Cyan</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 bg-brand-500 hover:bg-brand-600 text-white py-2.5 rounded-xl text-sm font-medium transition">Salvar</button>
                <button type="button" id="btn-del-camp" onclick="deleteCampaign()" class="hidden px-4 py-2.5 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm font-medium hover:bg-red-100">Excluir</button>
                <button type="button" onclick="closeCampModal()" class="px-6 py-2.5 border border-surface-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-surface-50">Cancelar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const statusColors = { planejamento:'blue', ativa:'green', pausada:'amber', finalizada:'purple' };
const statusIcons = { planejamento:'bi-clipboard', ativa:'bi-play-circle', pausada:'bi-pause-circle', finalizada:'bi-check-circle' };
let allCampaigns = [], currentFilter = '';

function campCard(c) {
    const sc = statusColors[c.status] || 'gray';
    const today = new Date().toISOString().split('T')[0];
    const isActive = c.start_date <= today && c.end_date >= today;
    const progress = c.content_count > 0 ? Math.round((c.posted_count / c.content_count) * 100) : 0;
    return `
    <div class="bg-white rounded-2xl border border-surface-200 shadow-sm hover:shadow-md transition overflow-hidden">
        <div class="h-2" style="background-color: ${c.color}"></div>
        <div class="p-5">
            <div class="flex items-start justify-between mb-3">
                <span class="inline-flex items-center gap-1.5 text-xs font-medium bg-${sc}-100 text-${sc}-600 px-2.5 py-1 rounded-full">
                    <i class="bi ${statusIcons[c.status]}"></i> ${c.status}
                </span>
                <div class="flex gap-1">
                    <button onclick="editCampaign(${c.id})" class="p-1.5 rounded-lg hover:bg-surface-100"><i class="bi bi-pencil text-gray-400 text-sm"></i></button>
                    <button onclick="deleteCampaignDirect(${c.id})" class="p-1.5 rounded-lg hover:bg-red-50"><i class="bi bi-trash text-red-400 text-sm"></i></button>
                </div>
            </div>
            <h4 class="font-bold text-gray-800 text-lg mb-1">${c.name}</h4>
            ${c.description ? `<p class="text-sm text-gray-500 line-clamp-2 mb-3">${c.description}</p>` : '<div class="mb-3"></div>'}
            <div class="flex items-center gap-4 text-xs text-gray-500 mb-3">
                <span><i class="bi bi-calendar3"></i> ${new Date(c.start_date).toLocaleDateString('pt-BR')} - ${new Date(c.end_date).toLocaleDateString('pt-BR')}</span>
            </div>
            ${c.budget > 0 ? `<div class="text-sm text-gray-600 mb-3"><i class="bi bi-cash"></i> R$ ${c.budget.toLocaleString('pt-BR', {minimumFractionDigits:2})}</div>` : ''}
            <div class="mt-3 pt-3 border-t border-surface-100">
                <div class="flex items-center justify-between text-xs text-gray-500 mb-1.5">
                    <span>${c.content_count} conteudo(s)</span>
                    <span>${progress}% postado</span>
                </div>
                <div class="w-full bg-surface-100 rounded-full h-2">
                    <div class="h-2 rounded-full transition-all" style="width:${progress}%; background-color:${c.color}"></div>
                </div>
            </div>
        </div>
        <div class="px-5 py-3 bg-surface-50 border-t border-surface-100 flex gap-2">
            ${['planejamento','ativa','pausada','finalizada'].map(s =>
                `<button onclick="updateCampStatus(${c.id},'${s}')" class="flex-1 text-xs py-1.5 rounded-lg ${c.status===s ? 'bg-'+statusColors[s]+'-500 text-white' : 'bg-white border border-surface-200 text-gray-500 hover:bg-surface-100'} transition">${s}</button>`
            ).join('')}
        </div>
    </div>`;
}

async function loadCampaigns() {
    const res = await fetch('/api/campaigns');
    allCampaigns = await res.json();
    let filtered = currentFilter ? allCampaigns.filter(c => c.status === currentFilter) : allCampaigns;

    document.getElementById('campaigns-grid').innerHTML = filtered.length
        ? filtered.map(campCard).join('')
        : '<div class="col-span-3 text-center py-12 text-gray-400"><i class="bi bi-megaphone text-4xl block mb-2"></i>Nenhuma campanha encontrada</div>';

    const stats = {planejamento:0, ativa:0, pausada:0, finalizada:0};
    allCampaigns.forEach(c => { if(stats[c.status] !== undefined) stats[c.status]++; });
    document.getElementById('camp-stats').innerHTML = Object.entries(stats).map(([s,n]) => `
        <div class="bg-${statusColors[s]}-50 border border-${statusColors[s]}-200 rounded-2xl p-4 text-center">
            <i class="bi ${statusIcons[s]} text-${statusColors[s]}-500 text-2xl"></i>
            <p class="text-2xl font-bold text-${statusColors[s]}-600 mt-1">${n}</p>
            <p class="text-sm text-${statusColors[s]}-600">${s.charAt(0).toUpperCase()+s.slice(1)}</p>
        </div>`).join('');
}

function filterCampaigns(status) {
    currentFilter = status;
    document.querySelectorAll('.camp-filter').forEach(b => {
        b.className = b.dataset.f === status
            ? 'camp-filter px-4 py-2 rounded-xl text-sm font-medium bg-brand-500 text-white'
            : 'camp-filter px-4 py-2 rounded-xl text-sm font-medium bg-white border border-surface-200 text-gray-600 hover:bg-surface-50';
    });
    loadCampaigns();
}

function openCampModal() { document.getElementById('camp-modal-title').textContent='Nova Campanha'; document.getElementById('camp-form').reset(); document.getElementById('camp-id').value=''; document.getElementById('camp-color').value='#6366f1'; document.getElementById('btn-del-camp').classList.add('hidden'); document.getElementById('camp-modal').classList.remove('hidden'); }
function closeCampModal() { document.getElementById('camp-modal').classList.add('hidden'); }

function editCampaign(id) {
    const c = allCampaigns.find(x => x.id === id);
    if (!c) return;
    document.getElementById('camp-modal-title').textContent = 'Editar Campanha';
    document.getElementById('camp-id').value = c.id;
    document.getElementById('camp-name').value = c.name;
    document.getElementById('camp-description').value = c.description || '';
    document.getElementById('camp-start').value = c.start_date;
    document.getElementById('camp-end').value = c.end_date;
    document.getElementById('camp-budget').value = c.budget;
    document.getElementById('camp-status').value = c.status;
    document.getElementById('camp-color').value = c.color;
    document.getElementById('btn-del-camp').classList.remove('hidden');
    document.getElementById('camp-modal').classList.remove('hidden');
}

async function saveCampaign(e) {
    e.preventDefault();
    const id = document.getElementById('camp-id').value;
    const body = { name: document.getElementById('camp-name').value, description: document.getElementById('camp-description').value, start_date: document.getElementById('camp-start').value, end_date: document.getElementById('camp-end').value, budget: parseFloat(document.getElementById('camp-budget').value)||0, status: document.getElementById('camp-status').value, color: document.getElementById('camp-color').value };
    if (id) { await fetch(`/api/campaigns/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    else { await fetch('/api/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    closeCampModal(); loadCampaigns();
}

async function deleteCampaign() { const id=document.getElementById('camp-id').value; if(!id||!confirm('Excluir esta campanha?'))return; await fetch(`/api/campaigns/${id}`,{method:'DELETE'}); closeCampModal(); loadCampaigns(); }
async function deleteCampaignDirect(id) { if(!confirm('Excluir esta campanha?'))return; await fetch(`/api/campaigns/${id}`,{method:'DELETE'}); loadCampaigns(); }
async function updateCampStatus(id,status) { await fetch(`/api/campaigns/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}); loadCampaigns(); }

loadCampaigns();
</script>
{% endblock %}
