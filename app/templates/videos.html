{% extends "base.html" %}
{% block title %}Producao de Video - Portal MKT{% endblock %}
{% block page_title %}Producao de Video{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div class="flex gap-2">
        <button onclick="filterVideos('')" class="filter-btn active px-4 py-2 rounded-xl text-sm font-medium bg-brand-500 text-white">Todos</button>
        {% for s in statuses %}
        <button onclick="filterVideos('{{ s }}')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-white border border-surface-200 text-gray-600 hover:bg-surface-50">{{ s|title }}</button>
        {% endfor %}
    </div>
    <button onclick="openVideoModal()" class="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 transition shadow-sm">
        <i class="bi bi-plus-lg"></i> Novo Video
    </button>
</div>

<div id="videos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
</div>

<!-- Modal -->
<div id="video-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden py-10 px-4 overflow-y-auto flex flex-col items-center">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full ">
        <div class="p-6 border-b border-surface-100 flex items-center justify-between">
            <h3 id="video-modal-title" class="text-lg font-bold text-gray-800">Novo Video</h3>
            <button onclick="closeVideoModal()" class="p-1 rounded-lg hover:bg-surface-100"><i class="bi bi-x-lg"></i></button>
        </div>
        <form id="video-form" onsubmit="saveVideo(event)" class="p-6 space-y-4">
            <input type="hidden" id="video-id" value="">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Titulo</label>
                <input type="text" id="video-title" required class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Roteiro</label>
                <textarea id="video-script" rows="8" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:border-transparent font-mono"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Local de Gravacao</label>
                    <input type="text" id="video-location" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select id="video-status" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                        {% for s in statuses %}<option value="{{ s }}">{{ s|title }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Responsavel</label>
                    <select id="video-responsible" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                        <option value="">Nenhum</option>
                        {% for u in users %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data limite</label>
                    <input type="date" id="video-due-date" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Duracao (segundos)</label>
                    <input type="number" id="video-duration" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Conteudo vinculado</label>
                    <select id="video-content" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500">
                        <option value="">Nenhum</option>
                        {% for c in contents %}<option value="{{ c.id }}">{{ c.title }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Observacoes</label>
                <textarea id="video-notes" rows="2" class="w-full border border-surface-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 bg-brand-500 hover:bg-brand-600 text-white py-2.5 rounded-xl text-sm font-medium transition">Salvar</button>
                <button type="button" onclick="closeVideoModal()" class="px-6 py-2.5 border border-surface-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-surface-50">Cancelar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const statusIcons = { roteiro: 'bi-file-text', gravado: 'bi-camera-video', edicao: 'bi-scissors', finalizado: 'bi-check-circle' };
const statusColors = { roteiro: 'amber', gravado: 'blue', edicao: 'purple', finalizado: 'green' };

function videoCard(v) {
    const color = statusColors[v.status] || 'gray';
    return `
    <div class="bg-white rounded-2xl border border-surface-200 shadow-sm hover:shadow-md transition overflow-hidden">
        <div class="p-5">
            <div class="flex items-start justify-between mb-3">
                <span class="inline-flex items-center gap-1.5 text-xs font-medium bg-${color}-100 text-${color}-600 px-2.5 py-1 rounded-full">
                    <i class="bi ${statusIcons[v.status]}"></i> ${v.status}
                </span>
                <div class="flex gap-1">
                    <button onclick="editVideo(${v.id})" class="p-1.5 rounded-lg hover:bg-surface-100"><i class="bi bi-pencil text-gray-400 text-sm"></i></button>
                    <button onclick="deleteVideo(${v.id})" class="p-1.5 rounded-lg hover:bg-red-50"><i class="bi bi-trash text-red-400 text-sm"></i></button>
                </div>
            </div>
            <h4 class="font-bold text-gray-800 mb-2">${v.title}</h4>
            ${v.location ? `<p class="text-sm text-gray-500 flex items-center gap-1 mb-2"><i class="bi bi-geo-alt"></i> ${v.location}</p>` : ''}
            ${v.script ? `<div class="bg-surface-50 rounded-xl p-3 mb-3 max-h-32 overflow-y-auto"><pre class="text-xs text-gray-600 whitespace-pre-wrap font-mono">${v.script.substring(0, 300)}${v.script.length > 300 ? '...' : ''}</pre></div>` : ''}
            <div class="flex items-center justify-between text-xs text-gray-400">
                <span>${v.responsible_name ? '<i class="bi bi-person"></i> ' + v.responsible_name : ''}</span>
                <span>${v.due_date ? '<i class="bi bi-calendar3"></i> ' + new Date(v.due_date).toLocaleDateString('pt-BR') : ''}</span>
            </div>
            ${v.duration_seconds ? `<div class="mt-2 text-xs text-gray-400"><i class="bi bi-clock"></i> ${Math.floor(v.duration_seconds/60)}min ${v.duration_seconds%60}s</div>` : ''}
        </div>
        <div class="px-5 py-3 bg-surface-50 border-t border-surface-100">
            <div class="flex gap-2">
                ${['roteiro','gravado','edicao','finalizado'].map(s => `<button onclick="updateVideoStatus(${v.id},'${s}')" class="flex-1 text-xs py-1.5 rounded-lg ${v.status===s ? 'bg-'+statusColors[s]+'-500 text-white' : 'bg-white border border-surface-200 text-gray-500 hover:bg-surface-100'} transition">${s}</button>`).join('')}
            </div>
        </div>
    </div>`;
}

let currentFilter = '';
async function loadVideos() {
    const url = currentFilter ? `/api/videos?status=${currentFilter}` : '/api/videos';
    const res = await fetch(url);
    const videos = await res.json();
    document.getElementById('videos-grid').innerHTML = videos.length ? videos.map(videoCard).join('') : '<div class="col-span-3 text-center py-12 text-gray-400"><i class="bi bi-camera-video text-4xl block mb-2"></i>Nenhum video encontrado</div>';
}

function filterVideos(status) {
    currentFilter = status;
    document.querySelectorAll('.filter-btn').forEach(b => { b.className = b.className.replace('bg-brand-500 text-white','bg-white border border-surface-200 text-gray-600 hover:bg-surface-50'); });
    event.target.className = event.target.className.replace('bg-white border border-surface-200 text-gray-600 hover:bg-surface-50','bg-brand-500 text-white');
    loadVideos();
}

function openVideoModal() { document.getElementById('video-modal-title').textContent='Novo Video'; document.getElementById('video-form').reset(); document.getElementById('video-id').value=''; document.getElementById('video-modal').classList.remove('hidden'); }
function closeVideoModal() { document.getElementById('video-modal').classList.add('hidden'); }

async function editVideo(id) {
    const res = await fetch('/api/videos');
    const items = await res.json();
    const v = items.find(i => i.id === id);
    if (!v) return;
    document.getElementById('video-modal-title').textContent = 'Editar Video';
    document.getElementById('video-id').value = v.id;
    document.getElementById('video-title').value = v.title;
    document.getElementById('video-script').value = v.script || '';
    document.getElementById('video-location').value = v.location || '';
    document.getElementById('video-status').value = v.status;
    document.getElementById('video-responsible').value = v.responsible_id || '';
    document.getElementById('video-due-date').value = v.due_date || '';
    document.getElementById('video-duration').value = v.duration_seconds || '';
    document.getElementById('video-content').value = v.content_id || '';
    document.getElementById('video-notes').value = v.notes || '';
    document.getElementById('video-modal').classList.remove('hidden');
}

async function saveVideo(e) {
    e.preventDefault();
    const id = document.getElementById('video-id').value;
    const body = {
        title: document.getElementById('video-title').value,
        script: document.getElementById('video-script').value,
        location: document.getElementById('video-location').value,
        status: document.getElementById('video-status').value,
        responsible_id: document.getElementById('video-responsible').value || null,
        due_date: document.getElementById('video-due-date').value || null,
        duration_seconds: parseInt(document.getElementById('video-duration').value) || null,
        content_id: document.getElementById('video-content').value || null,
        notes: document.getElementById('video-notes').value,
    };
    if (id) { await fetch(`/api/videos/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); }
    else { await fetch('/api/videos', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); }
    closeVideoModal(); loadVideos();
}

async function deleteVideo(id) { if(!confirm('Excluir este video?'))return; await fetch(`/api/videos/${id}`,{method:'DELETE'}); loadVideos(); }
async function updateVideoStatus(id, status) { await fetch(`/api/videos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}); loadVideos(); }

loadVideos();
</script>
{% endblock %}
