{% extends "base.html" %}
{% block title %}Producao de Video - Portal MKT{% endblock %}
{% block page_title %}Producao de Video{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div class="flex gap-2">
        <button onclick="filterVideos('')" class="filter-btn active px-4 py-2 rounded-xl text-sm font-medium bg-brand-500 text-white">Todos</button>
        {% for s in statuses %}
        <button onclick="filterVideos('{{ s }}')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-white dark:bg-gray-800 border border-surface-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-surface-50">{{ s|title }}</button>
        {% endfor %}
    </div>
    <button onclick="openVideoModal()" class="bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition-all shadow-lg shadow-brand-500/20 btn-ripple">
        <i class="bi bi-plus-lg"></i> Novo Video
    </button>
</div>

<div id="videos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

<!-- Modal -->
<div id="video-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col border dark:border-gray-700">
        <!-- Header fixo -->
        <div class="p-5 border-b border-surface-100 dark:border-gray-700 flex items-center justify-between flex-shrink-0">
            <h3 id="video-modal-title" class="text-lg font-bold text-gray-800 dark:text-white">Novo Video</h3>
            <button onclick="closeVideoModal()" class="p-1 rounded-lg hover:bg-surface-100 dark:hover:bg-gray-800"><i class="bi bi-x-lg"></i></button>
        </div>
        <!-- Form com scroll interno -->
        <form id="video-form" onsubmit="saveVideo(event)" class="flex flex-col flex-1 min-h-0">
            <div class="p-5 space-y-3 overflow-y-auto flex-1">
                <input type="hidden" id="video-id" value="">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Titulo</label>
                    <input type="text" id="video-title" required class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Roteiro</label>
                    <textarea id="video-script" rows="4" class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500 font-mono"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Local de Gravacao</label>
                        <input type="text" id="video-location" class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
                        <select id="video-status" class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500">
                            {% for s in statuses %}<option value="{{ s }}">{{ s|title }}</option>{% endfor %}
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Responsavel</label>
                        <select id="video-responsible" class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500">
                            <option value="">Nenhum</option>
                            {% for u in users %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Data limite</label>
                        <input type="date" id="video-due-date" class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Duracao (seg)</label>
                        <input type="number" id="video-duration" class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Conteudo vinculado</label>
                        <select id="video-content" class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500">
                            <option value="">Nenhum</option>
                            {% for c in contents %}<option value="{{ c.id }}">{{ c.title }}</option>{% endfor %}
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Observacoes</label>
                    <textarea id="video-notes" rows="2" class="w-full border border-surface-200 dark:border-gray-700 dark:bg-gray-800 dark:text-white rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-brand-500"></textarea>
                </div>
            </div>
            <!-- Footer fixo -->
            <div class="p-5 border-t border-surface-100 dark:border-gray-700 flex gap-3 flex-shrink-0">
                <button type="submit" class="flex-1 bg-gradient-to-r from-brand-500 to-brand-600 text-white py-2.5 rounded-xl text-sm font-semibold transition-all btn-ripple">Salvar</button>
                <button type="button" onclick="closeVideoModal()" class="px-6 py-2.5 border border-surface-200 dark:border-gray-700 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-surface-50 dark:hover:bg-gray-800">Cancelar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const statusIcons = { roteiro: 'bi-file-text', gravado: 'bi-camera-video', edicao: 'bi-scissors', finalizado: 'bi-check-circle' };
const statusColors = { roteiro: 'amber', gravado: 'blue', edicao: 'purple', finalizado: 'green' };

function videoCard(v) {
    const color = statusColors[v.status] || 'gray';
    return `
    <div class="bg-white dark:bg-gray-900 rounded-2xl border border-surface-200 dark:border-gray-800 shadow-sm hover:shadow-md transition overflow-hidden card-hover">
        <div class="p-5">
            <div class="flex items-start justify-between mb-3">
                <span class="inline-flex items-center gap-1.5 text-xs font-medium bg-${color}-100 dark:bg-${color}-900/30 text-${color}-600 dark:text-${color}-400 px-2.5 py-1 rounded-full">
                    <i class="bi ${statusIcons[v.status]}"></i> ${v.status}
                </span>
                <div class="flex gap-1">
                    <button onclick="editVideo(${v.id})" class="p-1.5 rounded-lg hover:bg-surface-100 dark:hover:bg-gray-800"><i class="bi bi-pencil text-gray-400 text-sm"></i></button>
                    <button onclick="deleteVideo(${v.id})" class="p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20"><i class="bi bi-trash text-red-400 text-sm"></i></button>
                </div>
            </div>
            <h4 class="font-bold text-gray-800 dark:text-white mb-2">${v.title}</h4>
            ${v.location ? `<p class="text-sm text-gray-500 flex items-center gap-1 mb-2"><i class="bi bi-geo-alt"></i> ${v.location}</p>` : ''}
            ${v.script ? `<div class="bg-surface-50 dark:bg-gray-800 rounded-xl p-3 mb-3 max-h-24 overflow-y-auto"><pre class="text-xs text-gray-600 dark:text-gray-400 whitespace-pre-wrap font-mono">${v.script.substring(0, 200)}${v.script.length > 200 ? '...' : ''}</pre></div>` : ''}
            <div class="flex items-center justify-between text-xs text-gray-400">
                <span>${v.responsible_name ? '<i class="bi bi-person"></i> ' + v.responsible_name : ''}</span>
                <span>${v.due_date ? '<i class="bi bi-calendar3"></i> ' + new Date(v.due_date).toLocaleDateString('pt-BR') : ''}</span>
            </div>
        </div>
        <div class="px-5 py-3 bg-surface-50 dark:bg-gray-800 border-t border-surface-100 dark:border-gray-700">
            <div class="flex gap-2">
                ${['roteiro','gravado','edicao','finalizado'].map(s => `<button onclick="updateVideoStatus(${v.id},'${s}')" class="flex-1 text-xs py-1.5 rounded-lg ${v.status===s ? 'bg-'+statusColors[s]+'-500 text-white' : 'bg-white dark:bg-gray-700 border border-surface-200 dark:border-gray-600 text-gray-500 dark:text-gray-400 hover:bg-surface-100'} transition">${s}</button>`).join('')}
            </div>
        </div>
    </div>`;
}

let currentFilter = '';
async function loadVideos() {
    const url = currentFilter ? `/api/videos?status=${currentFilter}` : '/api/videos';
    const res = await fetch(url);
    const videos = await res.json();
    document.getElementById('videos-grid').innerHTML = videos.length ? videos.map(videoCard).join('') : '<div class="col-span-3 text-center py-12 text-gray-400"><i class="bi bi-camera-video text-4xl block mb-2"></i>Nenhum video encontrado</div>';
}

function filterVideos(status) {
    currentFilter = status;
    document.querySelectorAll('.filter-btn').forEach(b => { b.className = b.className.replace('bg-brand-500 text-white','bg-white dark:bg-gray-800 border border-surface-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-surface-50'); });
    event.target.className = event.target.className.replace('bg-white dark:bg-gray-800 border border-surface-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-surface-50','bg-brand-500 text-white');
    loadVideos();
}

function openVideoModal() { document.getElementById('video-modal-title').textContent='Novo Video'; document.getElementById('video-form').reset(); document.getElementById('video-id').value=''; document.getElementById('video-modal').classList.remove('hidden'); }
function closeVideoModal() { document.getElementById('video-modal').classList.add('hidden'); }

async function editVideo(id) {
    const res = await fetch('/api/videos'); const items = await res.json(); const v = items.find(i => i.id === id); if (!v) return;
    document.getElementById('video-modal-title').textContent = 'Editar Video';
    document.getElementById('video-id').value = v.id;
    document.getElementById('video-title').value = v.title;
    document.getElementById('video-script').value = v.script || '';
    document.getElementById('video-location').value = v.location || '';
    document.getElementById('video-status').value = v.status;
    document.getElementById('video-responsible').value = v.responsible_id || '';
    document.getElementById('video-due-date').value = v.due_date || '';
    document.getElementById('video-duration').value = v.duration_seconds || '';
    document.getElementById('video-content').value = v.content_id || '';
    document.getElementById('video-notes').value = v.notes || '';
    document.getElementById('video-modal').classList.remove('hidden');
}

async function saveVideo(e) {
    e.preventDefault(); const id = document.getElementById('video-id').value;
    const body = { title: document.getElementById('video-title').value, script: document.getElementById('video-script').value, location: document.getElementById('video-location').value, status: document.getElementById('video-status').value, responsible_id: document.getElementById('video-responsible').value || null, due_date: document.getElementById('video-due-date').value || null, duration_seconds: parseInt(document.getElementById('video-duration').value) || null, content_id: document.getElementById('video-content').value || null, notes: document.getElementById('video-notes').value };
    if (id) { await fetch(`/api/videos/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); }
    else { await fetch('/api/videos', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); }
    closeVideoModal(); loadVideos();
}

async function deleteVideo(id) { if(!confirm('Excluir este video?'))return; await fetch(`/api/videos/${id}`,{method:'DELETE'}); loadVideos(); }
async function updateVideoStatus(id, status) { await fetch(`/api/videos/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}); loadVideos(); }

loadVideos();
</script>
{% endblock %}
